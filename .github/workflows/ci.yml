name: CI

# The gate a pull request has to pass. Nothing runs on a push to main: a pull request must be green
# to merge, so re-running the same matrix on the merge commit proves nothing and costs a machine —
# nightly.yml builds main after the merge instead. workflow_call stays because release.yml runs this
# as its own first gate.
on:
  pull_request:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  ci:
    uses: Hawkynt/RepositoryTemplate/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: AnythingToGif.sln
      test-target: AnythingToGif.Tests/AnythingToGif.Tests.csproj
      dotnet-version: '8.x'
      # net8.0-windows with WinForms and FFmpeg native DLLs can only run on Windows.
      runs-on: windows-latest
      # Built without ILRepack so the tests can see the unmerged interfaces.
      build-args: '-p:DisableILRepack=true'
      # AnythingToGif and GifFileFormat still carry ProjectReferences into C--FrameworkExtensions,
      # so the sibling has to sit next to this checkout for the relative paths to resolve.
      checkout-path: AnythingToGif
      working-directory: AnythingToGif
      siblings: '[{"repository":"Hawkynt/C--FrameworkExtensions","path":"C--FrameworkExtensions"}]'
      # Pinned to our own checkout: the sibling's packages are this repo's business to build, not
      # to lint. Left at the default it reported 86 errors about READMEs we do not own.
      package-readme-root: AnythingToGif
