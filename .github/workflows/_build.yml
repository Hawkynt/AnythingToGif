name: Build artifacts

# Called by release.yml and nightly.yml. Produces:
#   * AnythingToGif-cli-win-x64-<version>.zip           -- CLI
#   * AnythingToGif-AlgorithmComparison-win-x64-<v>.zip -- WinForms UI
#   * Hawkynt.GifFileFormat.<version>.nupkg             -- NuGet (release only)
#
# AnythingToGif currently has a ProjectReference to the sibling
# Hawkynt/C--FrameworkExtensions repo (temporary); both repos are checked out
# side-by-side so the relative path in the csproj resolves.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release-kind:
        required: true
        type: string
      changelog-flag:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
    outputs:
      cli-artifact:
        description: "CLI artifact name"
        value: ${{ jobs.build-exe.outputs.cli-artifact }}
      ui-artifact:
        description: "UI artifact name"
        value: ${{ jobs.build-exe.outputs.ui-artifact }}
      nuget-artifact:
        description: "NuGet artifact name (release only)"
        value: ${{ jobs.pack-nuget.outputs.artifact-name }}

jobs:
  build-exe:
    runs-on: windows-latest
    outputs:
      cli-artifact: AnythingToGif-cli-win-x64-${{ inputs.version }}
      ui-artifact:  AnythingToGif-AlgorithmComparison-win-x64-${{ inputs.version }}
    steps:
      - name: Checkout AnythingToGif
        uses: actions/checkout@v4
        with:
          path: AnythingToGif
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout FrameworkExtensions (sibling)
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/C--FrameworkExtensions
          path: C--FrameworkExtensions
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update CHANGELOG
        shell: bash
        working-directory: AnythingToGif
        run: node .github/workflows/scripts/update-changelog.mjs ${{ inputs.changelog-flag }}

      - name: Stamp versions into csprojs
        shell: bash
        working-directory: AnythingToGif
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Publish CLI (win-x64, self-contained)
        working-directory: AnythingToGif
        run: dotnet publish AnythingToGif/AnythingToGif.csproj -r win-x64 -c Release --self-contained --output publish/cli

      - name: Publish AlgorithmComparison UI (win-x64, self-contained)
        working-directory: AnythingToGif
        run: dotnet publish AlgorithmComparison/AlgorithmComparison.csproj -r win-x64 -c Release --self-contained --output publish/ui

      - name: Package CLI zip
        shell: pwsh
        working-directory: AnythingToGif
        run: |
          $v = "${{ inputs.version }}"
          Compress-Archive -Path publish/cli/* -DestinationPath "AnythingToGif-cli-win-x64-$v.zip"

      - name: Package UI zip
        shell: pwsh
        working-directory: AnythingToGif
        run: |
          $v = "${{ inputs.version }}"
          Compress-Archive -Path publish/ui/* -DestinationPath "AnythingToGif-AlgorithmComparison-win-x64-$v.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AnythingToGif-cli-win-x64-${{ inputs.version }}
          path: AnythingToGif/AnythingToGif-cli-win-x64-${{ inputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AnythingToGif-AlgorithmComparison-win-x64-${{ inputs.version }}
          path: AnythingToGif/AnythingToGif-AlgorithmComparison-win-x64-${{ inputs.version }}.zip

  pack-nuget:
    if: inputs.release-kind == 'release'
    runs-on: windows-latest
    outputs:
      artifact-name: GifFileFormat-nupkg-${{ inputs.version }}
    steps:
      - name: Checkout AnythingToGif
        uses: actions/checkout@v4
        with:
          path: AnythingToGif
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout FrameworkExtensions (sibling)
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/C--FrameworkExtensions
          path: C--FrameworkExtensions
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Stamp versions into csprojs
        shell: bash
        working-directory: AnythingToGif
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Pack NuGet
        working-directory: AnythingToGif
        run: dotnet pack GifFileFormat/GifFileFormat.csproj --configuration Release --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: GifFileFormat-nupkg-${{ inputs.version }}
          path: AnythingToGif/artifacts/*.nupkg
